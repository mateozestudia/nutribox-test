<h1>NutriBox · prueba del Data Layer</h1>
<p>Cada botón dispara un evento con la estructura de la Pre-entrega 8. Usalo con la Vista previa de GTM y DebugView.</p>
<button id="b-view">Ver Menú Semanal (view_item)</button>
<button id="b-cart">Agregar al carrito (add_to_cart)</button>
<button id="b-lead" class="o">Pedir recetas de muestra (generate_lead)</button>
<button id="b-lead-b2b" class="o">Consulta empresas (generate_lead B2B)</button>
<button id="b-buy">Confirmar compra (purchase)</button>
<p><small>Página de prueba: no procesa pagos ni envía datos personales.</small></p>
<script>
var ITEM={item_id:'NBX-001',item_name:'Menú Semanal',item_category:'caja_menu_semanal',price:45.00,quantity:1};
function ecom(name,extra){dataLayer.push({ecommerce:null});dataLayer.push(Object.assign({event:name,categoria_producto:'caja_menu_semanal'},{ecommerce:extra}));}
document.getElementById('b-view').onclick=function(){ecom('view_item',{currency:'USD',value:45.00,items:[ITEM]});};
document.getElementById('b-cart').onclick=function(){ecom('add_to_cart',{currency:'USD',value:45.00,items:[ITEM]});};
document.getElementById('b-lead').onclick=function(){dataLayer.push({event:'generate_lead',lead_type:'recetas_muestra',value:3.60,currency:'USD'});};
document.getElementById('b-lead-b2b').onclick=function(){dataLayer.push({event:'generate_lead',lead_type:'consulta_empresas',value:27.00,currency:'USD'});};
document.getElementById('b-buy').onclick=function(){ecom('purchase',{transaction_id:'NBX-ORD-'+Date.now(),currency:'USD',value:45.00,items:[ITEM]});};
</script></body></html>
